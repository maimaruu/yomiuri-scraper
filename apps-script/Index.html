<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --ink: #1f2937;
      --sub: #6b7280;
      --faint: #9ca3af;
      --line: #e5e7eb;
      --soft: #f7f7f5;
      --paper: #fffefb;
      --accent: #315c50;
      --accent-soft: #edf5f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--soft);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    button, textarea { font: inherit; }
    .app { min-height: 100vh; max-width: 820px; margin: 0 auto; background: var(--paper); }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      min-height: 58px; display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: rgba(255,254,251,.96);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
    }
    .topbar h1 { margin: 0; font-size: 17px; line-height: 1.4; }
    .back {
      border: 0; background: transparent; color: var(--accent); font-weight: 700;
      padding: 8px 4px; cursor: pointer;
    }
    .content { padding: 18px 16px 34px; }
    .eyebrow { color: var(--sub); font-size: 12px; margin-bottom: 5px; }
    .date { font-size: 24px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.02em; }
    .lead { color: var(--sub); font-size: 14px; line-height: 1.75; margin: 0 0 18px; }
    .article-list { display: grid; gap: 10px; }
    .article-card {
      width: 100%; text-align: left; border: 1px solid var(--line); background: #fff;
      border-radius: 14px; padding: 15px; cursor: pointer;
    }
    .article-card:hover { border-color: #cbd5d1; background: #fcfdfc; }
    .article-title { font-size: 16px; line-height: 1.6; font-weight: 750; }
    .meta { color: var(--sub); font-size: 12px; margin-top: 8px; }
    .status { color: var(--sub); text-align: center; padding: 48px 18px; line-height: 1.8; }
    .error { color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; padding: 12px; border-radius: 10px; }
    .article-head { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .article-head h2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 24px; line-height: 1.55; margin: 5px 0 8px; }
    .source-link { color: var(--accent); text-decoration: none; font-size: 12px; }
    .body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 16px; line-height: 2.05; white-space: pre-wrap; padding: 20px 0 24px;
    }
    .chat { border-top: 1px solid var(--line); padding-top: 20px; }
    .prompt { font-size: 14px; font-weight: 750; line-height: 1.7; margin-bottom: 10px; }
    textarea {
      width: 100%; min-height: 104px; resize: vertical; border: 1px solid #cfd5d2;
      border-radius: 12px; padding: 12px; outline: none; background: #fff; color: var(--ink);
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .send {
      width: 100%; border: 0; border-radius: 11px; padding: 12px 14px; margin-top: 9px;
      background: var(--accent); color: white; font-weight: 800; cursor: pointer;
    }
    .send:disabled { opacity: .45; cursor: default; }
    .messages { display: grid; gap: 10px; margin-bottom: 14px; }
    .bubble { max-width: 88%; padding: 11px 13px; border-radius: 14px; white-space: pre-wrap; line-height: 1.65; font-size: 14px; }
    .bubble.user { margin-left: auto; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .bubble.system { background: #f3f4f6; color: var(--ink); border-bottom-left-radius: 4px; }
    .hint { color: var(--faint); font-size: 11px; line-height: 1.6; margin-top: 7px; }
    .done-note { color: var(--sub); font-size: 12px; line-height: 1.7; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app" class="app"></div>

  <script>
    const FIRST_PROMPT = 'この記事を読んで、頭に浮かんだことを思いつくまま書いてください。まとまっていなくて大丈夫です。';
    const ACK = '記録しました。次からはAIが回答します。';

    const state = {
      screen: 'list',
      loading: true,
      error: '',
      articles: [],
      current: null,
      messages: [],
      sending: false,
      firstCommentDone: false,
      messageIndex: 0,
      presentedLogged: false
    };

    const browserId = getPersistentId('news-observation-browser-id', 'b');
    const sessionId = makeId('s');

    function makeId(prefix) {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }

    function getPersistentId(key, prefix) {
      let id = localStorage.getItem(key);
      if (!id) {
        id = makeId(prefix);
        localStorage.setItem(key, id);
      }
      return id;
    }

    function nowISO() { return new Date().toISOString(); }

    function shuffleOnce(items) {
      const arr = items.map(item => ({ ...item }));
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.map((item, i) => ({ ...item, display_position: i + 1 }));
    }

    function presentedArticles() {
      return state.articles.map(a => ({
        article_id: a.article_id,
        title: a.title,
        source_rank: a.source_rank,
        display_position: a.display_position,
        url: a.url
      }));
    }

    function logEvent(event) {
      const payload = {
        client_timestamp: nowISO(),
        browser_id: browserId,
        session_id: sessionId,
        ...event
      };
      google.script.run
        .withFailureHandler(err => console.error('log failed', err))
        .logEvent(payload);
    }

    function loadLatest() {
      state.loading = true;
      state.error = '';
      render();
      google.script.run
        .withSuccessHandler(articles => {
          const loaded = Array.isArray(articles) ? articles : [];
          state.articles = shuffleOnce(loaded);
          state.loading = false;
          render();
          if (!state.presentedLogged && state.articles.length) {
            state.presentedLogged = true;
            logEvent({
              event_type: 'list_presented',
              presented_articles: presentedArticles(),
              metadata: {
                count: state.articles.length,
                order_randomized: true,
                order_scope: 'session'
              }
            });
          }
        })
        .withFailureHandler(err => {
          state.loading = false;
          state.error = err && err.message ? err.message : String(err);
          render();
        })
        .getLatestArticles();
    }

    function openArticle(index) {
      const article = state.articles[index];
      if (!article) return;
      state.current = article;
      state.messages = [];
      state.firstCommentDone = false;
      state.messageIndex = 0;
      state.screen = 'read';
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
      logEvent({
        event_type: 'article_selected',
        article_id: article.article_id,
        source_rank: article.source_rank,
        display_position: article.display_position,
        title: article.title,
        url: article.url,
        presented_articles: presentedArticles()
      });
    }

    function backToList() {
      if (state.current) {
        logEvent({
          event_type: 'article_closed',
          article_id: state.current.article_id,
          source_rank: state.current.source_rank,
          display_position: state.current.display_position,
          title: state.current.title,
          url: state.current.url,
          metadata: { message_count: state.messageIndex }
        });
      }
      state.screen = 'list';
      state.current = null;
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function submitMessage() {
      const ta = document.getElementById('messageInput');
      if (!ta || state.sending) return;
      const text = ta.value.trim();
      if (!text) return;

      state.sending = true;
      state.messageIndex += 1;
      const index = state.messageIndex;
      const first = !state.firstCommentDone;
      state.messages.push({ role: 'user', text });
      ta.value = '';

      if (first) {
        state.firstCommentDone = true;
        state.messages.push({ role: 'system', text: ACK });
      }

      render();

      const article = state.current;
      google.script.run
        .withSuccessHandler(() => {
          state.sending = false;
          render();
        })
        .withFailureHandler(err => {
          state.sending = false;
          state.error = '記録に失敗しました。もう一度送信してください。';
          console.error(err);
          render();
        })
        .logEvent({
          client_timestamp: nowISO(),
          browser_id: browserId,
          session_id: sessionId,
          event_type: first ? 'first_comment' : 'user_message',
          article_id: article.article_id,
          source_rank: article.source_rank,
          display_position: article.display_position,
          title: article.title,
          url: article.url,
          message_index: index,
          message_text: text,
          metadata: { ai_enabled: false }
        });
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate() {
      return new Intl.DateTimeFormat('ja-JP', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
      }).format(new Date());
    }

    function render() {
      const app = document.getElementById('app');
      if (state.screen === 'read' && state.current) {
        app.innerHTML = renderRead();
      } else {
        app.innerHTML = renderList();
      }
    }

    function renderList() {
      let inner = '';
      if (state.loading) {
        inner = '<div class="status">今日のニュースを読み込んでいます…</div>';
      } else if (state.error) {
        inner = `<div class="error">${esc(state.error)}</div>`;
      } else if (!state.articles.length) {
        inner = '<div class="status">表示できる記事がありません。</div>';
      } else {
        inner = `<div class="article-list">${state.articles.map((a, i) => `
          <button class="article-card" onclick="openArticle(${i})">
            <div class="article-title">${esc(a.title || 'タイトルなし')}</div>
            <div class="meta">${esc(a.source || '読売新聞')}${a.published_at ? ' ・ ' + esc(a.published_at) : ''}</div>
          </button>`).join('')}</div>`;
      }

      return `
        <div class="topbar"><h1>ニュース読解観察ツール</h1></div>
        <main class="content">
          <div class="eyebrow">TODAY'S NEWS</div>
          <h2 class="date">${esc(formatDate())}</h2>
          <p class="lead">気になる記事を1つ選んで読んでください。最低1記事を選びます。</p>
          ${inner}
        </main>`;
    }

    function renderRead() {
      const a = state.current;
      const bubbles = state.messages.map(m =>
        `<div class="bubble ${m.role === 'user' ? 'user' : 'system'}">${esc(m.text)}</div>`
      ).join('');

      const promptBlock = state.firstCommentDone
        ? ''
        : `<div class="prompt">${esc(FIRST_PROMPT)}</div>`;

      return `
        <div class="topbar">
          <button class="back" onclick="backToList()">← 一覧</button>
          <h1>記事を読む</h1>
        </div>
        <main class="content">
          ${state.error ? `<div class="error" style="margin-bottom:12px">${esc(state.error)}</div>` : ''}
          <section class="article-head">
            <div class="eyebrow">${esc(a.source || '読売新聞')}</div>
            <h2>${esc(a.title)}</h2>
            <div class="meta">${esc(a.published_at || '')}</div>
            ${a.url ? `<a class="source-link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">元記事を開く ↗</a>` : ''}
          </section>
          <article class="body">${esc(a.body)}</article>
          <section class="chat">
            ${bubbles ? `<div class="messages">${bubbles}</div>` : ''}
            ${promptBlock}
            <textarea id="messageInput" placeholder="メッセージを入力"></textarea>
            <button class="send" onclick="submitMessage()" ${state.sending ? 'disabled' : ''}>${state.sending ? '記録中…' : '送信'}</button>
            ${state.firstCommentDone
              ? '<div class="done-note">現在はAI APIを接続していないため、入力内容だけを記録します。</div>'
              : '<div class="hint">最初のコメントにはAIから内容上の返答はありません。</div>'}
          </section>
        </main>`;
    }

    loadLatest();
  </script>
</body>
</html>
