name: Yomiuri Politics Scraper

on:
  schedule:
    # 3時間おきに実行 (UTC時間基準)
    # 日本時間とはズレますが、3時間間隔であることは変わりません
    - cron: '15 */3 * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Chrome and Driver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          # 最新のChromeDriverをインストールする処理はSelenium4以降
          # 自動管理される場合が多いですが、明示的なインストールは不要なケースが多いです
          # ここではChrome本体だけ入れればSelenium Managerがよしなにやってくれます

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create credentials file from Secret
        # ここでGitHubのSecretsからJSONファイルを復元します
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > credentials.json

      - name: Run scraper
        # credentials.jsonが存在する状態で実行されます
        run: python yomiuri_scraper.py
